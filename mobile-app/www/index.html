<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Royal SMM</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: #14132d; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #splash { position: fixed; inset: 0; isolation: isolate; overflow: hidden; background: radial-gradient(ellipse at 50% 28%, #40337e 0, transparent 48%), linear-gradient(155deg,#17152f,#211a50 58%,#103b47); color: white; display: grid; place-items: center; z-index: 20; transition: opacity .45s ease, visibility .45s ease; }
    #splash:before, #splash:after { content: ""; position: absolute; z-index: -1; width: 62vmax; height: 62vmax; border: 1px solid #ffffff12; border-radius: 50%; animation: orbit 12s linear infinite; }
    #splash:after { width: 46vmax; height: 46vmax; border-color: #71e5cb22; animation-duration: 9s; animation-direction: reverse; }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-content { text-align: center; padding: 28px; animation: appear .7s both; }
    .logo { width: 88px; height: 88px; border-radius: 28px; background: linear-gradient(145deg,#9583ff,#5638d9); border: 1px solid #ffffff40; display: grid; place-items: center; font-size: 36px; font-weight: 800; margin: 0 auto 18px; box-shadow: 0 22px 55px #06051f88, inset 0 1px #ffffff6b; animation: bob 1.8s ease-in-out infinite alternate; }
    .app-name { font-size: 1.2rem; font-weight: 800; letter-spacing: .01em; }
    .loading { color: #d2d0ec; font-size: .88rem; margin-top: 8px; }
    .progress { width: 100px; height: 3px; border-radius: 8px; background: #ffffff24; margin: 22px auto 0; overflow: hidden; }
    .progress:after { content: ""; display: block; width: 38%; height: 100%; border-radius: inherit; background: #69e0c1; animation: load .8s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-7px) rotate(2deg); } }
    @keyframes orbit { to { transform: rotate(360deg) scale(.93); } }
    @keyframes load { to { transform: translateX(165%); width: 55%; } }
    @keyframes appear { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="splash-content">
      <div class="logo">R</div>
      <div class="app-name">Royal SMM</div>
      <div class="loading">Opening your secure sign-in…</div>
      <div class="progress" aria-hidden="true"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
